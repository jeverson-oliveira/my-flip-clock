[package]
name = "flipclock"
version = "1.0.0"
description = "FlipClock — relógio flip e Pomodoro para o desktop"
authors = ["jeverson-oliveira"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flipclock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
