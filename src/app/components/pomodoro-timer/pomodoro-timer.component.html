<div class="clock-container pomodoro-timer" [ngClass]="state.mode" role="timer" [attr.aria-label]="label + ' ' + formattedTime">
  <div class="pomodoro-flip-container" aria-live="polite" aria-atomic="true">
  <div class="pomodoro-flip-section">
    <!-- Minutos -->
    <div class="pomodoro-flip-unit" *ngFor="let char of [formattedTime[0], formattedTime[1]]">
      <div class="pomodoro-flip-card">
        <div class="pomodoro-flip-card-front" aria-hidden="true">{{ char }}</div>
      </div>
    </div>

    <!-- Separador -->
    <div class="pomodoro-flip-separator" aria-hidden="true">:</div>

    <!-- Segundos -->
    <div class="pomodoro-flip-unit" *ngFor="let char of [formattedTime[3], formattedTime[4]]">
      <div class="pomodoro-flip-card">
        <div class="pomodoro-flip-card-front" aria-hidden="true">{{ char }}</div>
      </div>
    </div>

    <!-- Separador -->
    <div class="pomodoro-flip-separator small-separator" aria-hidden="true">:</div>

    <!-- Centésimos -->
    <div class="pomodoro-flip-unit small seconds-inline" *ngFor="let char of [formattedTime[6], formattedTime[7]]">
      <div class="pomodoro-flip-card">
        <div class="pomodoro-flip-card-front" aria-hidden="true">{{ char }}</div>
      </div>
    </div>
    <span class="sr-only">{{ formattedTime }}</span>
  </div>
  </div>

  <!-- Botões -->
  <div class="mode-switch" role="group" aria-label="Modo">
    <button [class.active]="state.mode==='focus'" (click)="switchMode('focus')">Foco</button>
    <button [class.active]="state.mode==='shortBreak'" (click)="switchMode('shortBreak')">Curta</button>
    <button [class.active]="state.mode==='longBreak'" (click)="switchMode('longBreak')">Longa</button>
  </div>

  <div class="controls">
    <button (click)="startPause()" [attr.aria-label]="state.running ? 'Pausar pomodoro' : 'Iniciar pomodoro'">
      {{ state.running ? '⏸️ Pausar' : '▶️ Iniciar' }}
    </button>
    <button (click)="reset()" aria-label="Resetar pomodoro">🔄 Resetar</button>
    <button (click)="showSettings = !showSettings" aria-label="Configurar">⚙️</button>
    <button (click)="enableNotifications()" aria-label="Ativar notificações">🔔</button>
  </div>

  <div class="settings" *ngIf="showSettings">
    <label>Foco (min) <input type="number" [(ngModel)]="focusMin" min="1" max="120" /></label>
    <label>Curta (min) <input type="number" [(ngModel)]="shortMin" min="1" max="60" /></label>
    <label>Longa (min) <input type="number" [(ngModel)]="longMin" min="1" max="60" /></label>
    <button (click)="saveSettings()">Salvar</button>
  </div>

  <div class="pomodoro-info">
    <h2>{{ label }}</h2>

  <!-- Ciclo -->
  <p>Ciclos concluídos: {{ state.cycleCount % 4 }} / 4</p>
  </div>
</div>
