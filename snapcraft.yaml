name: flip-clock
base: core24
version: '1.0.0'
summary: Flip Clock
description: |
  Flip Clock e Pomodoro Timer em Angular 20 — relógio flip com animação e timer pomodoro.
  Build com Angular application builder, output em docs/.

grade: stable
confinement: strict

parts:
  flip-clock:
    plugin: dump
    source: docs
    organize:
      '*': usr/share/flip-clock/
  launch-flip-clock:
    plugin: dump
    source: .
    organize:
      launch-flip-clock.sh: bin/launch-flip-clock

apps:
  flip-clock:
    command: bin/launch-flip-clock
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
